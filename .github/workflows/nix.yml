name: nix

on: [push, pull_request]

permissions: {}

jobs:
  nix:
    if: github.repository == 'step-security/rust-cache'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}

    name: Test Nix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1

      - uses: ./
        with:
          workspaces: tests
          cmd-format: nix develop ./tests -c {0}

      - run: |
          nix develop -c cargo check
          nix develop -c cargo test
        working-directory: tests
